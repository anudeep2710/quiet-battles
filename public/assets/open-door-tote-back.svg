  <text x="55" y="1004" fill="#302e29" font-family="monospace" font-size="18" letter-spacing="4">REVERSE / OPEN DOOR</text><text x="55" y="1037" fill="#79372b" font-family="serif" font-size="20" font-style="italic">A little room is bravery.</text>
